workflows:
  verify-three-iphone-apps:
    name: Verify SISS Staff, Admin and Supervisor
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Compile three apps and run contract tests
        script: |
          cd iOS-Apps
          bash scripts/build.sh verify
    artifacts:
      - iOS-Apps/build/**/*.xcresult
      - iOS-Apps/build/**/Build/Products/Debug-iphonesimulator/*.app

  signed-three-ipa-files:
    name: Export three signed IPA files
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Verify sources before archiving
        script: |
          cd iOS-Apps
          bash scripts/build.sh verify
      - name: Archive and export each app using automatic signing
        script: |
          cd iOS-Apps
          for scheme in SISSStaff SISSAdmin SISSSupervisor; do
            xcode-project build-ipa --workspace SISSApps.xcworkspace --scheme "$scheme" --archive-directory "build/$scheme" --ipa-directory "build/ipa/$scheme"
          done
    artifacts:
      - iOS-Apps/build/ipa/**/*.ipa
      - iOS-Apps/build/**/*.xcresult